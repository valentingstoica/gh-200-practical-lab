name: Contexts

on: workflow_dispatch

permissions: {}

env:
    COLOR: red

jobs:
    show_context:
        name: Show context
        runs-on: ubuntu-latest

        steps:
            - name: Show Github Actor
              env:
                  ACTOR: ${{ github.actor }}
              run: |
                  echo "$ACTOR"
                  echo "$COLOR"

            - name: Show Runner Info
              env:
                  OS: ${{ runner.os }}
                  NAME: ${{ runner.name }}
                  COLOR: blue
              run: |
                  echo "OS: $OS"
                  echo "Runner Name: $NAME"
                  echo "COLOR: $COLOR"

            - name: Show vars
              env:
                  APP_ENV: ${{ vars.APP_ENV }}
              run: |
                  echo "APP_ENV: $APP_ENV"

            - name: Show secret
              env:
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: |
                  echo "DB_PASSWORD: $DB_PASSWORD"
                  echo "parola-de-test-123"
