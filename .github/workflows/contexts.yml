name: Contexts

on: workflow_dispatch

permissions: {}

env:
    COLOR: red

jobs:
    job_id:
        name: Job Id
        runs-on: ubuntu-latest

        steps:
            - name: Show Github Actor
              env:
                  ACTOR: ${{ github.actor }}
              run: |
                  echo "$ACTOR"
                  echo "$COLOR"

            - name: Show Runner Info
              env:
                  OS: ${{ runner.os }}
                  NAME: ${{ runner.name }}
                  COLOR: blue
              run: |
                  echo "OS: $OS"
                  echo "Runner Name: $NAME"
                  echo "COLOR: $COLOR"
